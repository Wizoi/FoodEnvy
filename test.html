<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
  <style>body { font-family: sans-serif; padding: 20px; }</style>
</head>
<body>
  <h1>Testing Recipe Load</h1>
  <div id="status">Loading...</div>
  <div id="recipes"></div>

  <script>
    async function test() {
      try {
        const resp = await fetch('./foodenvy-complete-recipes.json');
        document.getElementById('status').textContent = 'Fetch status: ' + resp.status;

        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        const data = await resp.json();
        document.getElementById('status').textContent = 'Loaded: ' + (Array.isArray(data) ? data.length : data.recipes ? data.recipes.length : 'unknown') + ' recipes';

        const recipes = Array.isArray(data) ? data : data.recipes || [];
        document.getElementById('recipes').innerHTML = '<p>' + recipes.map(r => r.name).slice(0, 5).join('<br>') + '</p>';
      } catch (e) {
        document.getElementById('status').textContent = 'ERROR: ' + e.message;
      }
    }
    test();
  </script>
</body>
</html>
