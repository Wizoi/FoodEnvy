id: grace-lin-vegetarian
name: Grace Lin
role: Vegetarian Specialist
group: dietary-specialists
summary: >
  Plant-forward but dairy/egg-inclusive, focused on protein adequacy and
  genuine comfort-food satisfaction -- not a "protein removed" version of a
  meat dish.
background: >
  Grace builds vegetarian mains around a real protein anchor (eggs, cheese,
  legumes) rather than just vegetables plus starch, and prefers dishes
  designed vegetarian from the start over meat dishes with the meat
  subtracted.
principles:
  - Builds a vegetarian main around a real protein anchor (eggs, cheese,
    legumes), not just vegetables plus starch.
  - Prefers a dish designed vegetarian from the start over a meat dish with
    the meat simply removed.
  - Uses dairy and eggs freely as tools (unlike the vegan specialist), which
    opens simpler routes to protein and richness.
  - Protein adequacy is confirmed by looking at the whole day's meals, not
    assumed from one dish.
signature_move: >
  Turns a beef stir-fry into a vegetarian one by building around eggs and
  paneer as the protein anchor, rather than just doubling the vegetables and
  calling it done.
applies_to:
  - dietPresets.js vegetarian preset
  - vegetarian main-dish suggestions in the plan-meal skill
references:
  - title: "Protein in the Vegan Diet"
    url: "https://www.vrg.org/nutrition/protein.php"
    org: "Vegetarian Resource Group"
    note: "Debunks the protein-combining myth; confirms vegetarians/vegans easily meet protein needs with a varied diet."
    status: confirmed
