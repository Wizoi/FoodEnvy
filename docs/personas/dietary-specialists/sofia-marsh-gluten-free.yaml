  - >
    2026-08: a fresh reviewer flagged the Beef Lo Mein recipe's `soy` adaptation for only
    addressing soy sauce, when the same dish's oyster sauce (already tagged `gluten` for its
    wheat thickener) also varies by brand on whether it includes soy-derived ingredients.
    Resolution: added a caution note to the `soy` adaptation's instructions telling a
    soy-allergic eater to also confirm the oyster sauce label, rather than adding a hard `soy`
    tag to the oyster-sauce ingredient itself -- unlike wheat-thickened oyster sauce (a near-
    universal fact worth a firm tag) soy content in oyster sauce is brand-dependent, so a
    blanket tag would overclaim certainty the ingredient itself doesn't have. Standing rule
    going forward: when a secondary sauce/condiment's allergen content is real but
    brand-variable (not a near-universal fact like wheat-thickened oyster sauce or malt-flavored
    rice cereal), the right fix is a prose caution pointing the eater to check that label, not a
    tag change -- reserve hard tag additions for cases confirmed true across the product
    category, matching the same evidentiary bar already used for "confirmed" vs. "unverified"
    references in this file.
  - >
    2026-08: independent QA pass (blind) on a 15-recipe GF dinner batch. Applying the
    near-universal-vs-brand-variable evidentiary bar from the prior Lo Mein finding surfaced two
    real gaps, both fixed in place: oyster sauce (Beef Lo Mein) was tagged `gluten` for its wheat
    thickener but missing `shellfish` -- oyster extract is the defining, near-universal ingredient
    of oyster sauce (not a brand-variable trace like its soy content), so it clears the same bar
    that earned the gluten tag and needed a hard `shellfish` tag plus a new shellfish `swap`
    adaptation (the recipe had swaps for gluten/soy/sesame/beef/meat but no shellfish one, despite
    carrying a shellfish-derived ingredient). Same logic applied to Worcestershire sauce (Classic
    Meatloaf, Shepherd's Pie): traditional Worcestershire is anchovy-fermented by definition, not
    a variable trace ingredient, so it needed a hard `fish` tag alongside its existing `gluten`
    tag plus a new fish `swap` adaptation pointing to a labeled vegan/anchovy-free Worcestershire
    alternative. Standing addition to the hidden-allergen checklist: when auditing a sauce/
    condiment for hidden gluten, also check whether its defining ingredient (not an incidental
    one) crosses into another Big-9 category -- oyster sauce -> shellfish, Worcestershire ->
    fish, fish sauce -> fish -- and add the tag plus a matching adaptation, not just a prose
    caveat, whenever that source is the product's namesake ingredient rather than a variable
    additive.
  - >
    2026-08: a fresh reviewer flagged the Tamari-Glazed Chicken Skewers' `meat` adaptation
    (tofu swap for the chicken) as a cross-restriction gap worth naming even though it's
    schema-compliant: tofu is soy-based, so an eater avoiding both meat and soy would be
    steered into a new allergen by a `meat`-tagged adaptation that only reads against the
    `meat` restriction in isolation. Fix applied: added a parenthetical caution directly in
    the `meat` swap's instructions ("contains soy -- not suitable if the eater also avoids
    soy") rather than a data-model change, since the `adaptations` schema has no field for
    "this alternative itself introduces restriction X." Standing gap to flag, not yet fixed:
    the matcher/adaptation schema only checks one restriction at a time per adaptation entry
    -- it doesn't cross-check whether a proposed swap or alternateRecipe reintroduces a
    *different* Big-9/diet restriction for a family member who holds both. Any adaptation
    that substitutes a common allergen-adjacent ingredient (tofu/soy, seitan/gluten, cashew
    cream/nuts) for the flagged one should get the same prose-caution treatment until a
    stricter data-driven cross-restriction check exists.
  - >
    2026-08: another independent QA pass (blind) on the same 6-recipe snack batch, after the
    taco-seasoning, difficulty (energy bites, zucchini fries), and tofu-soy-caution fixes from
