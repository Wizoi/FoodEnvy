  - >
    2026-08: a fresh reviewer flagged the Flourless Chocolate Torte's `dairy` adaptation for
    originally addressing only the butter, when dark baking chocolate itself commonly contains
    milkfat or carries a "may contain milk" cross-contact warning. Fix applied in place: the
    `dairy` swap's instructions now also require a certified dairy-free/vegan dark chocolate bar,
    not just a dairy-free butter substitute. Deliberately did NOT add a blanket `dairy` tag to the
    dark-chocolate ingredient line itself -- unlike Worcestershire's anchovy or oyster sauce's
    oyster extract (near-universal, namesake ingredients that clear the hard-tag bar), a meaningful
    share of baking dark chocolate is genuinely dairy-free, so tagging it dairy outright would
    incorrectly exclude the base recipe for dairy-restricted members who could eat it with a
    verified brand. This is the same evidentiary bar as the Lo Mein oyster-sauce/soy finding, just
    landing on the prose-caution side rather than the hard-tag side: dark chocolate's dairy risk is
    real but brand-variable, not a defining ingredient of the product category. Standing addition
    to the checklist: dark/baking chocolate joins tamari, rice cereal, oats, corn chips/tortillas,
    taco seasoning, broth, and baking powder as an ingredient needing a "certified dairy-free/vegan"
    label-check callout whenever it appears in a dairy-adaptation instruction, even when the base
    recipe's ingredient tag correctly stays untagged.
