    (certified soy-free chocolate bar, check label each time) matching the cookie recipe's existing
    wording. Standing rule this confirms: a hard allergen tag on an ingredient obligates a matching
    adaptation entry for that restriction within the same recipe, not just correctness of the tag
    itself -- consistent with the earlier oyster-sauce/shellfish and Worcestershire/fish findings,
    now generalized to same-batch internal consistency (if one recipe in a batch treats an
    ingredient's tag as adaptation-worthy, every recipe with that same tagged ingredient should too).
    Everything else -- full field-by-field check on both embedded `alternateRecipe`s (aquafaba
    torte, aquafaba macaroons), difficulty/mealType enums, prep/cook time plausibility against
    written steps, and the egg-structural-vs-binder call (both chocolate recipes' whipped-air eggs
    correctly routed to `alternateRecipe`, the rice pudding's yolk-as-thickener and galette's
    egg-wash correctly routed to `swap`) -- held up clean.
